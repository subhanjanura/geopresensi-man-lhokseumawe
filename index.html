<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geopresensi MAN Kota Lhokseumawe</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f3f4; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #16a085; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 0.9em; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #16a085; color: white; border: none; padding: 12px; font-size: 1em; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #138d75; }
        .btn-secondary { background: #e74c3c; margin-top: 5px; }
        .btn-secondary:hover { background: #c0392b; }
        #status-box, #login-error { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 0.9em; text-align: center; display: none; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .info-lokasi { background: #e8f4f8; padding: 10px; border-radius: 6px; font-size: 0.85em; margin-bottom: 15px; line-height: 1.5; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>GEOPRESENSI MAN KOTA LHOKSEUMAWE</h2>
        <div class="subtitle">Sistem Kehadiran Guru & Tenaga Kependidikan</div>

        <!-- HALAMAN LOGIN -->
        <div id="loginSection">
            <h3 style="color: #2c3e50; text-align: center; margin-bottom: 20px;">Silakan Login Terlebih Dahulu</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label>NIK (Nomor Induk Kependudukan)</label>
                    <input type="text" id="loginNik" required placeholder="Masukkan NIK Anda" maxlength="16">
                </div>
                <div class="form-group">
                    <label>Password (Masukkan NIK Anda kembali)</label>
                    <input type="password" id="loginPassword" required placeholder="Masukkan NIK sebagai password">
                </div>
                <button type="submit" id="btnLogin">Masuk (Login)</button>
            </form>
            <div id="login-error" class="alert-danger"></div>
        </div>

        <!-- HALAMAN UTAMA PRESENSI -->
        <div id="presensiSection" class="hidden">
            <div class="info-lokasi">
                <strong>Selamat datang, <span id="userDisplayName"></span></strong><br>
                <strong>Lokasi Madrasah:</strong> MAN Kota Lhokseumawe<br>
                <strong>Lokasi Anda Saat Ini:</strong> <span id="userRealLocation" style="color: #2980b9;">Mendeteksi lokasi perangkat...</span>
            </div>

            <form id="presensiForm">
                <div class="form-group">
                    <label>Status Kehadiran</label>
                    <select id="status">
                        <option value="Hadir">Hadir (Clock-In)</option>
                        <option value="Pulang">Pulang (Clock-Out)</option>
                        <option value="Dinas Luar">Dinas Luar / Tugas Resmi</option>
                        <option value="Sakit/Izin">Sakit / Izin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Keterangan (Opsional)</label>
                    <input type="text" id="keterangan" placeholder="Keterangan tambahan jika ada">
                </div>
                <button type="submit" id="btnSubmit">Kirim Presensi Sekarang</button>
            </form>

            <button type="button" class="btn-secondary" onclick="logout()">Keluar (Logout)</button>

            <div id="status-box"></div>
        </div>
    </div>

    <script>
        // Ganti dengan URL Web App Google Apps Script Anda yang valid
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlTxvYf8DfP_i_9aFq3Rv4OGrsqTLg9Xgwd6rdho8kRUpZ6FBjsY5rW9oftuujTetyKw/exec";
        
        // Koordinat MAN Kota Lhokseumawe
        const LAT_MADRASAH = 5.187779;
        const LNG_MADRASAH = 97.147981;
        const MAX_RADIUS = 500; // dalam meter

        let currentUser = null;

        // FUNGSI DETEKSI LOKASI RIIL PERANGKAT USER
        function deteksiLokasiUser() {
            const locationSpan = document.getElementById('userRealLocation');

            if (!navigator.geolocation) {
                locationSpan.innerText = "Geolocation tidak didukung oleh browser.";
                return;
            }

            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                // Menggunakan Nominatim OpenStreetMap untuk Reverse Geocoding
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`;

                fetch(url, {
                    headers: {
                        'Accept-Language': 'id'
                    }
                })
                .then(res => res.json())
                .then(data => {
                    if (data && data.display_name) {
                        locationSpan.innerText = data.display_name;
                    } else {
                        locationSpan.innerText = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
                    }
                })
                .catch(err => {
                    locationSpan.innerText = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
                });

            }, function(error) {
                locationSpan.innerText = "Gagal mendeteksi GPS (Izin lokasi ditolak / GPS mati)";
            }, { enableHighAccuracy: true });
        }

        // PROSES LOGIN KE SPREADSHEET BERDASARKAN NIK
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nik = document.getElementById('loginNik').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btnLogin = document.getElementById('btnLogin');
            const errorBox = document.getElementById('login-error');

            btnLogin.innerText = "Memeriksa Akun...";
            btnLogin.disabled = true;
            errorBox.style.display = 'none';

            const payload = {
                action: "login",
                nik: nik,
                password: password
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                btnLogin.innerText = "Masuk (Login)";
                btnLogin.disabled = false;

                if (data.status === "success") {
                    currentUser = data.user;
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('presensiSection').classList.remove('hidden');
                    document.getElementById('userDisplayName').innerText = `${currentUser.nama} (${currentUser.role})`;
                    
                    // Panggil fungsi deteksi lokasi riil perangkat setelah login berhasil
                    deteksiLokasiUser();
                } else {
                    errorBox.style.display = 'block';
                    errorBox.innerText = data.message || 'NIK atau Password salah!';
                }
            })
            .catch(err => {
                btnLogin.innerText = "Masuk (Login)";
                btnLogin.disabled = false;
                errorBox.style.display = 'block';
                errorBox.innerText = 'Terjadi kesalahan koneksi ke server.';
            });
        });

        function logout() {
            currentUser = null;
            document.getElementById('loginForm').reset();
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('presensiSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function hitungJarak(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            var R = 6371000; // meter
            var dLat = toRad(lat2 - lat1);
            var dLon = toRad(lon2 - lon1);
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // PROSES KIRIM PRESENSI
        document.getElementById('presensiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const statusBox = document.getElementById('status-box');
            btn.innerText = "Mendeteksi Lokasi GPS...";
            btn.disabled = true;

            if (!navigator.geolocation) {
                alert("Geolocation tidak didukung oleh browser Anda.");
                btn.innerText = "Kirim Presensi Sekarang";
                btn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const jarak = hitungJarak(lat, lng, LAT_MADRASAH, LNG_MADRASAH);

                let statusKehadiranValidasi = document.getElementById('status').value;
                
                if (jarak > MAX_RADIUS && statusKehadiranValidasi === "Hadir") {
                    statusBox.style.display = "block";
                    statusBox.className = "alert-warning";
                    statusBox.innerHTML = `<strong>Peringatan!</strong> Anda berada di luar radius madrasah (${Math.round(jarak)}m). Absen Hadir ditolak.`;
                    btn.innerText = "Kirim Presensi Sekarang";
                    btn.disabled = false;
                    return;
                }

                const payload = {
                    action: "checkin",
                    timestamp: new Date().toLocaleString("id-ID", {timeZone: "Asia/Jakarta"}),
                    nik: currentUser.nik,
                    nama: currentUser.nama,
                    role: currentUser.role,
                    status: statusKehadiranValidasi,
                    latitude: lat,
                    longitude: lng,
                    jarak: Math.round(jarak) + " meter",
                    keterangan: document.getElementById('keterangan').value
                };

                fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    statusBox.style.display = "block";
                    statusBox.className = "alert-success";
                    statusBox.innerHTML = "Berhasil! Presensi anda telah tercatat di Spreadsheet. Jarak dari lokasi: " + Math.round(jarak) + "m";
                    btn.innerText = "Kirim Presensi Sekarang";
                    btn.disabled = false;
                    document.getElementById('presensiForm').reset();
                })
                .catch(err => {
                    statusBox.style.display = "block";
                    statusBox.className = "alert-success";
                    statusBox.innerHTML = "Berhasil! Presensi terkirim ke Spreadsheet.";
                    btn.innerText = "Kirim Presensi Sekarang";
                    btn.disabled = false;
                    document.getElementById('presensiForm').reset();
                });

            }, function(error) {
                alert("Gagal mendapatkan lokasi GPS. Pastikan GPS aktif dan izin lokasi diizinkan.");
                btn.innerText = "Kirim Presensi Sekarang";
                btn.disabled = false;
            }, { enableHighAccuracy: true });
        });
    </script>
</body>
</html>
